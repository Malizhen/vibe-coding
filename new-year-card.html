<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元旦快乐 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #FF6347 100%);
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰图案 */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.3) 0%, transparent 50%);
            z-index: 0;
        }

        /* 烟花容器 */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        /* 主卡片容器 */
        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(255, 250, 240, 0.9));
            border-radius: 30px;
            padding: 60px 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.3),
                inset 0 0 80px rgba(255, 215, 0, 0.1),
                0 0 0 8px rgba(255, 215, 0, 0.2);
            border: 3px solid #FFD700;
            animation: cardAppear 1.5s ease-out;
            position: relative;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: scale(0.7) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 卡片装饰角 */
        .card::before,
        .card::after {
            content: '福';
            position: absolute;
            font-size: 40px;
            color: #FFD700;
            font-weight: bold;
            opacity: 0.3;
        }

        .card::before {
            top: 20px;
            left: 20px;
            animation: rotate 8s linear infinite;
        }

        .card::after {
            bottom: 20px;
            right: 20px;
            animation: rotate 8s linear infinite reverse;
        }

        @keyframes rotate {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.1);
            }
        }

        /* 年份标题 */
        .year {
            color: #DC143C;
            font-size: 5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 
                3px 3px 0 #FFD700,
                6px 6px 0 rgba(0, 0, 0, 0.1);
            animation: yearBounce 2s ease-in-out infinite;
            letter-spacing: 10px;
        }

        @keyframes yearBounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* 主标题 */
        .title {
            color: #DC143C;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: titleGlow 3s ease-in-out infinite;
            font-weight: bold;
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 
                    2px 2px 4px rgba(0, 0, 0, 0.2),
                    0 0 20px rgba(255, 215, 0, 0.3);
            }
            50% {
                text-shadow: 
                    2px 2px 4px rgba(0, 0, 0, 0.2),
                    0 0 40px rgba(255, 215, 0, 0.6);
            }
        }

        /* 装饰线 */
        .divider {
            width: 70%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #DC143C, #FFD700, #DC143C, transparent);
            margin: 30px auto;
            position: relative;
            animation: dividerPulse 2s ease-in-out infinite;
        }

        @keyframes dividerPulse {
            0%, 100% {
                opacity: 1;
                transform: scaleX(1);
            }
            50% {
                opacity: 0.7;
                transform: scaleX(0.95);
            }
        }

        .divider::before,
        .divider::after {
            content: '◆';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #FFD700;
            font-size: 16px;
        }

        .divider::before {
            left: -30px;
        }

        .divider::after {
            right: -30px;
        }

        /* 祝福语 */
        .message {
            color: #8B0000;
            font-size: 1.4em;
            line-height: 2;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 2s ease-out 0.5s forwards;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 成语祝福 */
        .idioms {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 2s ease-out 1s forwards;
        }

        .idiom {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #8B0000;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            animation: idiomFloat 3s ease-in-out infinite;
            border: 2px solid #DC143C;
        }

        .idiom:nth-child(1) {
            animation-delay: 0s;
        }

        .idiom:nth-child(2) {
            animation-delay: 0.5s;
        }

        .idiom:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes idiomFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* 署名 */
        .signature {
            color: #DC143C;
            font-style: italic;
            font-size: 1.2em;
            margin-top: 30px;
            opacity: 0;
            animation: fadeInUp 2s ease-out 1.5s forwards;
            font-weight: 500;
        }

        /* 底部装饰 */
        .decorations {
            margin-top: 30px;
            font-size: 35px;
            letter-spacing: 15px;
            opacity: 0;
            animation: fadeInUp 2s ease-out 2s forwards;
        }

        /* 灯笼装饰 */
        .lanterns {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .lantern {
            position: absolute;
            font-size: 50px;
            animation: swing 3s ease-in-out infinite;
        }

        .lantern:nth-child(1) {
            top: 5%;
            left: 10%;
            animation-delay: 0s;
        }

        .lantern:nth-child(2) {
            top: 5%;
            right: 10%;
            animation-delay: 1s;
        }

        @keyframes swing {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .card {
                padding: 40px 30px;
                margin: 10px;
            }

            .year {
                font-size: 3em;
                letter-spacing: 5px;
            }

            .title {
                font-size: 2em;
            }

            .message {
                font-size: 1.1em;
            }

            .idioms {
                gap: 10px;
            }

            .idiom {
                font-size: 0.9em;
                padding: 10px 15px;
            }

            .lantern {
                font-size: 35px;
            }
        }

        /* 闪烁的金色光点 */
        .sparkle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: sparkleAnim 2s ease-in-out infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- 背景图案 -->
    <div class="bg-pattern"></div>

    <!-- 烟花容器 -->
    <div class="fireworks-container" id="fireworks"></div>

    <!-- 灯笼装饰 -->
    <div class="lanterns">
        <div class="lantern">🏮</div>
        <div class="lantern">🏮</div>
    </div>

    <!-- 主卡片 -->
    <div class="card-container">
        <div class="card">
            <div class="year">2026</div>
            
            <h1 class="title">元旦快乐</h1>
            
            <div class="divider"></div>
            
            <p class="message">
                辞旧迎新贺元旦<br>
                万象更新又一年<br>
                愿新的一年<br>
                万事如意 心想事成
            </p>

            <div class="idioms">
                <span class="idiom">龙马精神</span>
                <span class="idiom">前程似锦</span>
                <span class="idiom">福星高照</span>
            </div>
            
            <div class="divider"></div>
            
            <p class="signature">
                祝您新年快乐，阖家幸福！
            </p>
            
            <div class="decorations">
                🎊 🎉 🎆
            </div>
        </div>
    </div>

    <script>
        // 创建烟花效果
        function createFirework(x, y) {
            const colors = ['#FFD700', '#FF6347', '#FFA500', '#FF69B4', '#00FFFF', '#ADFF2F'];
            const particles = 30;
            const container = document.getElementById('fireworks');
            
            for (let i = 0; i < particles; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = x + 'px';
                firework.style.top = y + 'px';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (Math.PI * 2 * i) / particles;
                const velocity = 2 + Math.random() * 3;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                
                container.appendChild(firework);
                
                animateFirework(firework, vx, vy);
            }
        }

        function animateFirework(element, vx, vy) {
            let x = parseFloat(element.style.left);
            let y = parseFloat(element.style.top);
            let opacity = 1;
            let gravity = 0.05;
            let life = 60;
            
            function update() {
                life--;
                vy += gravity;
                x += vx;
                y += vy;
                opacity -= 0.015;
                
                element.style.left = x + 'px';
                element.style.top = y + 'px';
                element.style.opacity = opacity;
                element.style.transform = `scale(${1 + (60 - life) / 30})`;
                
                if (life > 0 && opacity > 0) {
                    requestAnimationFrame(update);
                } else {
                    element.remove();
                }
            }
            
            update();
        }

        // 随机位置发射烟花
        function launchRandomFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * (window.innerHeight * 0.6);
            createFirework(x, y);
        }

        // 创建闪烁光点
        function createSparkles() {
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(sparkle);
            }
        }

        // 页面加载完成后初始化
        window.onload = function() {
            // 创建闪烁光点
            createSparkles();
            
            // 初始烟花
            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    setTimeout(launchRandomFirework, i * 300);
                }
            }, 500);
            
            // 持续发射烟花
            setInterval(() => {
                const burstCount = Math.random() > 0.5 ? 2 : 1;
                for (let i = 0; i < burstCount; i++) {
                    setTimeout(launchRandomFirework, i * 200);
                }
            }, 2000);
        };

        // 点击页面也可以发射烟花
        document.addEventListener('click', function(e) {
            createFirework(e.clientX, e.clientY);
        });
    </script>
</body>
</html>
