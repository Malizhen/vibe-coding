<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - 管理后台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin-page">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <a href="/admin/dashboard">管理后台</a>
            </div>
            <nav class="admin-nav">
                <a href="/admin/dashboard" class="nav-item">仪表盘</a>
                <a href="/admin/posts" class="nav-item active">文章管理</a>
                <a href="/admin/posts/new" class="nav-item">写新文章</a>
                <a href="/admin/comments" class="nav-item">评论管理</a>
                <hr>
                <a href="/" class="nav-item" target="_blank">查看网站</a>
                <a href="/admin/logout" class="nav-item">退出登录</a>
            </nav>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <h1>文章管理</h1>
                <a href="/admin/posts/new" class="btn btn-primary">写新文章</a>
            </header>
            <div class="admin-content">
                {{if .Posts}}
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>标题</th>
                            <th>分类</th>
                            <th>日期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Posts}}
                        <tr>
                            <td>
                                <a href="/post/{{.Slug}}" target="_blank">{{.Title}}</a>
                            </td>
                            <td>{{.Category}}</td>
                            <td>{{formatDateShort .Date}}</td>
                            <td class="actions">
                                <a href="/admin/posts/edit/{{.Slug}}" class="btn btn-small">编辑</a>
                                <a href="/admin/posts/delete/{{.Slug}}" class="btn btn-small btn-danger" onclick="return confirm('确定要删除这篇文章吗？')">删除</a>
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
                {{else}}
                <div class="empty-state">
                    <p>还没有文章</p>
                    <a href="/admin/posts/new" class="btn btn-primary">写第一篇文章</a>
                </div>
                {{end}}
            </div>
        </main>
    </div>
</body>
</html>
