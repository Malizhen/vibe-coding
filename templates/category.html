{{template "header" .}}
            <div class="content-area">
                <h1 class="page-title">分类: {{.Category}}</h1>
                {{if .Posts}}
                <div class="post-list">
                    {{range .Posts}}
                    <article class="post-card">
                        <header class="post-header">
                            <h2 class="post-title">
                                <a href="/post/{{.Slug}}">{{.Title}}</a>
                            </h2>
                            <div class="post-meta">
                                <time datetime="{{formatDateShort .Date}}">{{formatDate .Date}}</time>
                                <span class="reading-time">{{.ReadingTime}} 分钟阅读</span>
                            </div>
                        </header>
                        <p class="post-excerpt">{{.Excerpt}}</p>
                        {{if .Tags}}
                        <footer class="post-tags">
                            {{range .Tags}}
                            <a href="/tag/{{.}}" class="tag">{{.}}</a>
                            {{end}}
                        </footer>
                        {{end}}
                    </article>
                    {{end}}
                </div>
                {{else}}
                <div class="empty-state">
                    <p>该分类下暂无文章。</p>
                    <a href="/" class="btn">返回首页</a>
                </div>
                {{end}}
            </div>
            {{template "sidebar" .}}
{{template "footer" .}}
